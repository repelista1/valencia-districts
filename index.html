<script>
var CITIES={"valencia": {"name": "Валенсия", "viewbox": "-190 0 870 621", "polys": [["M224 346 202 388 183 368 189 362 184 358 197 348 224 346Z", "#E3B505", "Barrio de Favara", "Обычный рабочий квартал в районе Patraix без криминальной репутации. Скромный жилфонд, тихая жилая среда."], ["M224 346 248 363 253 364 252 371 233 367 227 402 195 402 224 346Z", "#E3B505", "L'Hort de Senabre", "Рабочий квартал в Jesús между La Raiosa и La Creu Coberta. Без особой славы, скромно и тихо."], ["M499 356 510 356 517 361 514 366 536 398 535 411 506 450 494 483 489 483 496 397 494 397 499 356Z", "#C62828", "Nazaret", "Изолированный портом бывший рыбацкий район: кражи, поджоги и окупас стали постоянным фоном для жителей. Расширение порта и спортивные проекты обещают оживление, но пока это одна из худших зон города."], ["M327 402 333 399 337 405 343 406 351 410 350 415 347 415 345 429 351 431 350 440 347 439 346 445 327 442 329 412 327 402Z", "#E3B505", "Fonteta de Sant Lluís", "Небольшой бывший посёлок в Quatre Carreres рядом с новыми зонами развития. Тихо, но инфраструктура скромная и есть точечные социальные проблемы."], ["M437 224 472 238 470 243 475 245 473 249 463 245 454 268 451 269 426 259 437 224Z", "#E3B505", "Ciutat Jardí", "Среднеклассовый район у Blasco Ibáñez рядом с кампусами UV и UPV, с хорошей инфраструктурой и Plaza del Cedro. Портит картину криминальная статистика: зона Cedro — лидер по вероятности квартирных краж (~+40% к среднему по городу)."], ["M415 185 401 180 404 159 391 157 392 151 385 150 387 140 372 137 385 105 397 115 409 130 422 139 445 143 459 150 415 185Z", "#E3B505", "Camí de Vera", "Окраинный квартал района Benimaclet у кампуса UPV. Тихо и близко к университетам, но застройка простая и стареющая."], ["M105 326 112 303 189 298 189 305 153 348 131 372 105 326Z", "#E3B505", "Vara de Quart", "Смешанный квартал Patraix: жильё соседствует с промзоной. Спокойно, но эстетики и сервисов немного."], ["M87 264 115 252 122 243 139 241 149 243 150 261 139 260 87 264Z", "#E3B505", "Soternes", "Маленький рабочий район у границы с Мислатой. Тихий, но без изысков; зона Olivereta точечно упоминается в сводках по наркотикам."], ["M112 303 119 285 127 284 125 261 149 261 146 272 149 301 112 303Z", "#D85A30", "La Fontsanta", "Анклав старого соцжилья в L'Olivereta. Fuensanta упоминается в сводках среди городских зон потребления наркотиков, среда депрессивная."], ["M260 193 254 222 255 247 258 257 255 263 223 206 238 200 258 188 260 193Z", "#8BC34A", "El Botànic", "Приятный центральный район в Extramurs у Ботанического сада. Спокойная жилая среда рядом со старым городом."], ["M318 78 315 86 320 88 319 91 323 93 319 100 316 98 312 104 305 118 264 129 259 111 274 107 269 87 268 76 291 72 299 72 318 78Z", "#D85A30", "Torrefiel", "Плотный рабочий район в Rascanya, сосед Orriols с похожей социоэкономикой. Регулярно фигурирует в жалобах на уличную преступность, хоть и не так громко, как сосед."], ["M264 129 305 118 284 155 280 154 278 146 267 149 247 135 264 129Z", "#E3B505", "Tormos", "Скромный рабочий квартал La Saïdia. Без криминальной славы, но и без особых плюсов."], ["M378 138 387 140 385 150 392 151 391 157 404 159 401 180 415 185 407 194 399 208 360 170 362 164 356 162 350 155 347 159 331 153 330 155 325 155 332 144 347 133 350 136 345 142 354 152 362 141 371 141 372 137 378 138Z", "#8BC34A", "Benimaclet", "Бывшая деревня с богемной атмосферой, один из самых тихих и безопасных районов города. Университеты рядом, кражи со взломом заметно ниже среднего; есть лишь точечные наркоточки на окраине."], ["M330 155 331 153 347 159 350 155 356 161 337 212 330 218 303 198 325 155 330 155Z", "#8BC34A", "Trinitat", "Тихий жилой район La Saïdia напротив садов Viveros через Турию. Спокойная семейная среда."], ["M506 218 533 229 548 230 552 242 558 303 521 305 490 300 495 285 497 268 498 269 497 259 500 249 506 218Z", "#C62828", "Cabanyal", "Исторический рыбацкий район у пляжа, стабильно входящий в списки самых проблемных в Испании: наркоторговля, окупас, кражи. Джентрификация и реновация меняют картину — приморская часть уже заметно лучше глубины района."], ["M279 217 278 223 290 225 289 233 296 235 286 253 276 246 276 244 270 244 273 239 269 235 269 229 271 225 269 219 279 217Z", "#8BC34A", "El Mercat", "Квартал вокруг Центрального рынка и Лонхи (ЮНЕСКО). Туристический трафик приносит карманников, в остальном ухоженный и живой центр."], ["M344 239 358 263 305 291 300 278 332 246 344 239Z", "#2E7D32", "El Pla del Remei", "Самый богатый район города: модернистские фасады, бутики Calle Colón, лучшие сервисы. Из-за концентрации магазинов и офисов относительно часты кражи из торговых точек и машин, но на бытовую жизнь это почти не влияет."], ["M463 245 478 251 475 260 472 259 471 260 473 261 472 264 473 266 478 268 497 268 495 285 455 270 454 268 463 245Z", "#E3B505", "L'Illa Perduda", "Рабочий квартал у университетов в Algirós. Старый жилфонд, но тихо и относительно дёшево для такой локации."], ["M150 261 199 272 203 288 195 298 149 301 146 272 149 261 150 261Z", "#C62828", "Tres Forques", "Западный рабочий квартал со старым соцжильём и социальной напряжённостью. Один из самых депрессивных районов внутри города."], ["M199 272 225 278 241 306 235 309 238 313 231 323 234 326 224 346 189 305 189 298 195 298 203 288 199 272Z", "#8BC34A", "Patraix", "Спокойный семейный район с историческим ядром-«деревней» и стабильной статистикой. Один из самых недооценённых районов города."], ["M235 309 241 306 252 327 260 324 257 337 269 357 254 355 253 364 248 363 224 346 234 326 231 323 238 313 235 309Z", "#E3B505", "La Raiosa", "Обычный спокойный рабочий район в Jesús, сосед Patraix. Ровная жилая среда без криминальной славы."], ["M384 323 398 328 436 359 445 361 440 371 437 375 414 366 342 406 337 405 334 402 342 398 340 394 344 391 362 365 361 362 365 360 383 332 378 327 384 323Z", "#2E7D32", "Ciutat de les Arts i les Ciències", "Новая дорогая застройка вокруг Города искусств и наук, по сути продолжение Penya-roja. Современное жильё, широкие улицы, минимум бытовой преступности."], ["M206 533 215 503 207 501 210 492 207 488 207 478 211 462 226 467 240 469 232 493 230 492 229 493 221 536 206 533Z", "#E3B505", "Turianova", "Новый жилой анклав на юге у La Fe: современные дома, но «остров» без сложившейся инфраструктуры и городской жизни вокруг."], ["M296 235 303 237 303 242 298 240 298 249 301 247 315 250 316 244 320 245 321 241 331 247 319 261 300 278 276 271 268 267 258 257 257 255 262 253 269 254 276 251 276 246 286 253 296 235Z", "#2E7D32", "Sant Francesc", "Деловое сердце города вокруг площади Ратуши. Дорого и ухоженно; единственный минус — карманники из-за туристического трафика."], ["M338 40 328 66 333 68 329 83 335 86 333 89 342 98 341 100 337 96 333 100 335 102 332 105 338 110 328 120 333 124 329 129 339 139 332 144 305 118 312 104 316 98 319 100 323 93 319 91 320 88 315 86 318 78 322 79 325 66 330 56 336 37 338 40Z", "#C62828", "Els Orriols", "Район у стадиона Levante с хронической проблемой безопасности: жители многократно протестовали, требуя полицию. Днём терпимо, ночью — вандализм, поджоги и активность организованных группировок."], ["M321 213 316 216 310 215 302 234 303 237 290 234 290 225 278 223 279 217 285 217 285 214 290 213 294 202 304 199 321 213Z", "#2E7D32", "La Seu", "Квартал Кафедрального собора — сердце старого города. Максимально туристический, ухоженный и безопасный."], ["M362 307 374 302 384 323 378 325 378 327 382 329 379 332 340 353 328 325 362 307Z", "#D85A30", "Monteolivete / En Corts", "Кварталы к югу от русла Турии рядом с Городом наук. Контраст между новой застройкой по краям и скромным старым ядром с социальной нагрузкой."], ["M269 357 257 404 246 401 227 402 233 367 252 371 254 355 269 357Z", "#E3B505", "La Creu Coberta", "Южный рабочий квартал района Jesús у Малильи. Скромно, но тихо."], ["M184 358 189 362 183 368 202 388 195 402 215 402 204 439 223 436 235 438 246 401 257 404 240 469 226 467 211 462 186 448 171 433 147 402 157 387 184 358Z", "#E3B505", "Camí Real", "Маленький рабочий квартал района Jesús. Без криминальной славы, скромный жилфонд, тихо."], ["M492 538 484 537 367 485 323 480 327 442 346 445 347 439 350 440 351 431 345 429 347 415 350 415 352 412 350 410 342 406 414 366 437 375 445 361 457 363 499 356 494 397 496 397 489 471 491 519 495 515 492 538Z", "#E3B505", "La Punta", "Полусельская зона huerta между городом и портом. Тихо и просторно, но инфраструктура минимальна, а соседство с Nazaret и промзоной требует внимательности."], ["M45 99 42 92 43 91 38 87 37 82 32 73 20 28 57 20 97 47 108 51 120 59 113 88 114 90 105 87 62 90 55 86 51 87 51 96 48 96 48 99 45 99Z", "#8BC34A", "Benimàmet", "Полуавтономный посёлок на северо-западе с метро. Репутация скромная, но по данным страховщиков это одна из самых безопасных зон по кражам в жилье (−50% от среднего)."], ["M385 105 371 141 362 141 354 152 345 142 350 136 347 133 339 139 329 129 333 124 328 120 338 110 332 105 335 102 333 100 337 96 341 100 342 98 333 89 335 86 329 83 333 68 328 66 338 40 345 44 348 42 358 48 366 55 371 46 376 45 394 55 390 61 399 68 399 69 388 82 395 86 384 103 385 105Z", "#8BC34A", "Sant Llorenç", "Зона новостроек у Alfahuir на севере города: современное жильё, торговые центры. Минус — проблемный Orriols через дорогу."], ["M231 66 193 96 191 94 188 97 169 74 171 68 180 68 180 67 188 69 192 56 210 40 231 66Z", "#D85A30", "Ciutat Fallera", "Периферийный рабочий квартал при мастерских фальяс на севере города. Слабая инфраструктура, социальная напряжённость, соседство с проблемным Benicalap."], ["M142 242 141 237 195 223 225 278 150 261 149 243 142 242Z", "#E3B505", "Nou Moles", "Обычный среднеклассовый район в L'Olivereta без криминальных «горячих точек». В сводках зона Olivereta упоминается среди мест потребления наркотиков, но точечно."], ["M119 285 119 282 104 279 98 272 87 265 125 261 127 284 119 285Z", "#E3B505", "La Llum", "Маленький жилой квартал L'Olivereta у больницы General. Тихо и функционально."], ["M514 159 533 168 545 169 549 174 550 223 548 230 533 229 506 218 514 159Z", "#D85A30", "Malvarrosa", "Пляжный район, где тихие жилые кварталы соседствуют с очагами конфликтности; в сезон растут кражи и проблемы ночной жизни. Главная язва — «Casitas Rosas», одна из самых известных точек наркоторговли города; разница между улицами огромная."], ["M329 148 303 198 291 189 279 183 282 159 288 147 295 151 293 155 311 153 317 154 319 145 329 148Z", "#E3B505", "Morvedre", "Район La Saïdia сразу за Туриёй от старого города. Активно джентрифицируется, среда смешанная и быстро меняется."], ["M225 160 226 162 230 160 236 171 231 173 244 197 233 203 222 207 194 224 182 226 176 206 183 203 167 174 196 158 200 166 219 155 225 160Z", "#E3B505", "Campanar", "Район у парка Cabecera с историческим ядром и хорошей инфраструктурой. Однако по кражам показывает один из самых высоких уровней в городе; старая часть у парка лучше зоны ближе к Nou Campanar."], ["M270 181 285 185 304 199 294 202 290 213 285 214 285 217 265 220 254 224 260 193 258 188 270 181Z", "#8BC34A", "El Carme", "Открыточный старый город: галереи, бары, уличное искусство. Вечером шумно и работают карманники из-за туристического потока, но для жизни район безопасный."], ["M376 186 399 208 400 205 409 208 404 222 348 202 352 192 367 199 370 192 376 186Z", "#8BC34A", "Ciutat Universitària", "Кампусная зона в Algirós: университетские корпуса, общежития, спортплощадки. Днём людно и безопасно, ночью пустовато."], ["M505 221 500 249 497 259 498 269 478 268 473 266 472 259 475 260 478 251 481 252 494 217 505 221Z", "#8BC34A", "Beteró (Calle d'Empar Ballester)", "«Буферный» район Poblats Marítims между университетской зоной Tarongers и морем. Микс новостроек и старого соцжилья, отличный транспорт, 12-е место из 86 по цене аренды; качество сильно зависит от конкретного квартала — соседи через дорогу Malvarrosa и Cabanyal."], ["M382 214 411 224 383 297 374 302 362 270 344 239 355 232 371 238 374 229 376 230 382 214Z", "#8BC34A", "Mestalla", "Район вок     el.setAttribute('d',p[0]);el.setAttribute('fill',p[1]);el.setAttribute('fill-opacity','0.8');
    el.setAttribute('data-n',p[2]);el.setAttribute('data-r',p[3]);
    svg.appendChild(el);paths.push(el);
  });
  idx=paths.map(function(p){var k=norm(p.dataset.n);return{p:p,n:p.dataset.n,k:k,w:k.split(' ')};});
  cur=[];act=-1;q.value='';sug.style.display='none';clearHi();toggleClr();
}

svg.addEventListener('mousemove',function(e){
  var t=e.target;
  if(t.tagName==='path'&&t.dataset.n){pinned=false;showTip(t,e.clientX+14,e.clientY+14);}
  else if(!pinned)tip.style.display='none';
});
svg.addEventListener('mouseleave',function(){if(!pinned)tip.style.display='none'});
q.addEventListener('input',function(){cur=matches(q.value);highlight(cur);renderSug(cur);toggleClr();});
q.addEventListener('keydown',function(e){
  var items=sug.querySelectorAll('div[data-i]');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!items.length)return;
    act=e.key==='ArrowDown'?(act+1)%items.length:(act-1+items.length)%items.length;
    [].forEach.call(items,function(el,i){el.classList.toggle('act',i===act);});
    items[act].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){
    if(cur.length)select(cur[Math.max(0,act)]);
  } else if(e.key==='Escape'){
    q.value='';cur=[];clearHi();sug.style.display='none';toggleClr();q.blur();
  }
});
clr.addEventListener('mousedown',function(e){
  e.preventDefault();
  q.value='';cur=[];act=-1;clearHi();sug.style.display='none';toggleClr();q.focus();
});
q.addEventListener('blur',function(){setTimeout(function(){sug.style.display='none';},150);});
q.addEventListener('focus',function(){if(q.value.trim()){cur=matches(q.value);renderSug(cur);}});

ORDER.forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=CITIES[k].name;sel.appendChild(o);});
sel.addEventListener('change',function(){buildCity(sel.value);});
buildCity(ORDER[0]);
</script>
</body>
</html>
